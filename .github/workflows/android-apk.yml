name: Build Android installer

on:
  push:
    branches:
      - arena/b846dd14-chatairoleplay
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web app and sync Android project
        run: npm run android:sync

      - name: Build debug-signed APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/Miry-Android-debug.apk

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: miry-android-installer
          path: artifacts/Miry-Android-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-installer --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create android-installer \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Миры — установщик Android" \
              --notes "Последняя debug-сборка Android-приложения. Сборка автоматически обновляется вместе с веткой arena/b846dd14-chatairoleplay." \
              --prerelease
          fi
          gh release upload android-installer artifacts/Miry-Android-debug.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
